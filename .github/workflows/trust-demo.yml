name: Executable trust proof

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm trust doctor --config examples/demo-app/trust.yaml --contract examples/demo-app/change-contract.yaml
      - run: pnpm demo:prove
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trust-reports
          path: examples/demo-app/.trust/runs
