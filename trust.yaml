version: 1
repository:
  name: executable-trust-layer
  root: .
  allow_explicit_changed_files: false
knowledge:
  sources:
    - AGENTS.md
    - README.md
    - docs/architecture.md
    - docs/github-actions.md
    - docs/mission-generation-benchmark-2026-08-25.md
    - docs/mission-generation.md
    - docs/releases.md
    - docs/specification.md
    - docs/threat-model.md
    - examples/demo-app/AGENTS.md
authority:
  allow_local_approvals: true
  require_signed_reports: false
  trusted_approvers: []
  trusted_reporters: []
execution:
  allow_shell_commands: false
  inherit_environment: false
  max_attempts: 1
  retry_backoff_ms: 250
checks:
  - id: typecheck
    kind: static
    scope:
      - "**/*"
    tags: []
    required: false
    timeout_ms: 120000
    executable: pnpm
    args:
      - run
      - typecheck
    cwd: .
    env: {}
  - id: lint
    kind: static
    scope:
      - "**/*"
    tags: []
    required: false
    timeout_ms: 120000
    executable: pnpm
    args:
      - run
      - lint
    cwd: .
    env: {}
  - id: test
    kind: test
    scope:
      - "**/*"
    tags: []
    required: false
    timeout_ms: 120000
    executable: pnpm
    args:
      - run
      - test
    cwd: .
    env: {}
  - id: build
    kind: static
    scope:
      - "**/*"
    tags: []
    required: false
    timeout_ms: 120000
    executable: pnpm
    args:
      - run
      - build
    cwd: .
    env: {}
invariants: []
surfaces:
  - id: repository
    description: Repository-wide starter surface generated by discovery; narrow before production
    paths:
      - "**/*"
    requires:
      - typecheck
      - lint
      - test
      - build
    risks: []
    depends_on: []
verifiers: []
qa:
  enabled: false
  instructions: []
  screenshot: true
  timeout_ms: 30000
