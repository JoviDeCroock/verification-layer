version: 1
id: organization-invitations
intent: Add organization invitations without weakening authorization or existing signup behavior.
expected_behaviors:
  - id: happy-path
    description: admins can invite users by email
    evidence: [intent-browser#happy-path, intent-device#happy-path]
  - id: authorization
    description: non-admins cannot invite users
    evidence:
      - api-requests#unauthorized-invitation
      - intent-browser#authorization
      - intent-device#authorization
  - id: duplicate-submission
    description: duplicate invitations do not create duplicate pending invitations
    evidence: [intent-browser#duplicate-submission, intent-device#duplicate-submission]
  - id: expiration
    description: invitations expire after seven days
    evidence: [intent-browser#expiration, intent-device#expiration]
  - id: regression
    description: existing signup behavior remains unchanged
    evidence: [playwright-ui, intent-browser#regression, intent-device#regression]
affected_surfaces:
  - team-management
  - authentication
risks:
  - authorization
  - state integrity
  - mobile ui
required_evidence:
  - typecheck
  - unit-tests
  - demo-client-bundle
  - playwright-ui
  - api-requests
  - trust-cli
  - intent-browser
  - intent-device
excluded:
  - item: production email delivery
    reason: The demo has no external email provider.
approval:
  status: approved
  approved_by: demo-product-owner
  approved_at: 2026-08-25T04:00:00.000Z
  content_sha256: b7a23e120cce88ebf9248383fb98cbd16e5d4a85bad911c58200de5b96e8c4f6
  method: local
